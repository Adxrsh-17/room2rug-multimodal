name: CI Quality Gate

on:
  push:
    branches: [ main, "phase-*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache Hugging Face Hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('scripts/ci_quality_gate.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install ruff pytest pytest-cov pyyaml numpy pandas scikit-learn lightgbm faiss-cpu fastapi psutil rank-bm25 pillow requests transformers sentence-transformers sentencepiece uvicorn beautifulsoup4 lxml

      - name: Lint Code with Ruff
        run: |
          ruff check .

      - name: Verify Code Formatting with Ruff
        run: |
          ruff format --check .

      - name: Run Unit & Leakage Tests
        run: |
          set -o pipefail
          python -m pytest tests/test_seed.py tests/test_config.py tests/test_leakage.py tests/test_baseline_v1_unit.py tests/test_metrics.py tests/test_cielab.py tests/test_explain.py tests/test_quality_gate.py -v --tb=short 2>&1 | tee pytest.log

      - name: Pytest Step Summary
        if: always()
        run: |
          if [ -f pytest.log ]; then
            echo "### Pytest Execution Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 35 pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Automated Quality Gate (Lineage, Regression & Latency)
        run: |
          set -o pipefail
          python scripts/ci_quality_gate.py 2>&1 | tee quality_gate.log

      - name: Quality Gate Step Summary
        if: always()
        run: |
          if [ -f quality_gate.log ]; then
            echo "### Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 35 quality_gate.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
