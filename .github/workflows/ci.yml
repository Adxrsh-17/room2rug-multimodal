name: CI Quality Gate

on:
  push:
    branches: [ main, "phase-*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pyyaml numpy pandas scikit-learn lightgbm faiss-cpu fastapi psutil rank-bm25

      - name: Lint Code with Ruff
        run: |
          ruff check .

      - name: Verify Code Formatting with Ruff
        run: |
          ruff format --check .

      - name: Run Unit & Leakage Tests
        run: |
          pytest tests/test_seed.py tests/test_config.py tests/test_leakage.py tests/test_baseline_v1_unit.py tests/test_metrics.py tests/test_cielab.py tests/test_explain.py -v

      - name: Automated Quality Gate (Lineage, Regression & Latency)
        run: |
          python scripts/ci_quality_gate.py
