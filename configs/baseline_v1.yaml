seed: 42

model:
  name: "baseline_v1_heuristic_clip"
  text_encoder: "sentence-transformers/all-MiniLM-L6-v2"
  multimodal_encoder: "openai/clip-vit-base-patch32"

retrieval:
  top_k: 10
  min_score_threshold: 0.15
  fusion_weights:
    image: 0.6
    text: 0.4

filtering:
  size_tolerance_ft: 1.5
  weights:
    size: 0.4
    color: 0.3
    style: 0.3
