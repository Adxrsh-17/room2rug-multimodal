[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room2rug-multimodal"
version = "0.2.0"
description = "Multimodal Search & Recommendation System for Interior Rugs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Adarsh Pradeep"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0,<5.0.0",
    "torch>=2.0.0",
    "faiss-cpu>=1.7.4",
    "pillow>=9.5.0",
    "requests>=2.31.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "mlflow>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
    "streamlit>=1.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.baseline_v1*", "src.utils*", "src.data*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "src/baseline_v1",
    "tests/legacy_test_pipeline.py",
    "scratch",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --durations=10"
